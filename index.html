<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AD Pentest Reference</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#1c2128;--border:#30363d;
  --text:#e6edf3;--text2:#8b949e;
  --blue:#58a6ff;--green:#2ea043;--red:#f85149;--orange:#ffa657;--purple:#a371f7;--yellow:#d29922;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:14px;line-height:1.5;display:flex;min-height:100vh}
#sidebar{width:260px;min-width:260px;background:var(--bg2);border-right:1px solid var(--border);padding:16px;position:sticky;top:0;height:100vh;overflow-y:auto}
#sidebar h1{font-size:13px;font-weight:700;letter-spacing:1.5px;color:var(--text);margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);text-transform:uppercase}
.fg{margin-bottom:14px}
.fg-label{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--text2);margin-bottom:6px;text-transform:uppercase}
.fg-hint{font-size:10px;color:var(--text2);cursor:help;opacity:.6;text-transform:none;letter-spacing:0;font-weight:400}
/* ── Flow & Tracker view ──────────────────────────────── */
#view-tabs{display:flex;gap:6px;margin-bottom:14px}
.vtab{background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:5px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.3px;transition:all .15s}
.vtab:hover{border-color:#484f58;color:var(--text)}
.vtab.active{border-color:var(--blue);color:var(--text)}
#flow-view{display:none}
#loot-tracker{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:12px}
#loot-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
#loot-hdr-title{font-size:11px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:1px}
#loot-hdr-btns{display:flex;gap:6px}
.loot-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:3px 10px;border-radius:4px;cursor:pointer;font-size:11px;transition:all .15s}
.loot-btn:hover{border-color:var(--blue);color:var(--blue)}
#loot-infra{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.li-field>label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--text2);font-weight:700;margin-bottom:3px}
.li-field input{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:5px 8px;border-radius:4px;font-size:12px;outline:none;font-family:inherit;transition:border-color .15s}
.li-field input:focus{border-color:var(--blue)}
.li-field input::placeholder{color:#484f58}
#l-access-wrap{margin-bottom:10px}
#l-access-wrap>label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--text2);font-weight:700;margin-bottom:5px}
#l-access-btns{display:flex;flex-wrap:wrap;gap:4px}
.alevbtn{background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:3px 9px;border-radius:10px;cursor:pointer;font-size:11px;transition:all .15s}
.alevbtn:hover{border-color:var(--blue);color:var(--text)}
.alevbtn.on{background:#0d2a50;border-color:var(--blue);color:#79c0ff;font-weight:600}
#loot-areas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.la-field>label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--text2);font-weight:700;margin-bottom:3px}
.la-field textarea{width:100%;height:90px;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:4px;font-size:11px;resize:vertical;outline:none;font-family:inherit;line-height:1.4;transition:border-color .15s}
.la-field textarea:focus{border-color:var(--blue)}
.la-field textarea::placeholder{color:#484f58}
#flow-ph-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
#flow-ph-hdr>span{font-size:11px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:1px}
#flow-reset-btn{background:transparent;border:1px solid var(--border);color:var(--text2);padding:3px 10px;border-radius:4px;cursor:pointer;font-size:11px;transition:all .15s}
#flow-reset-btn:hover{border-color:var(--red);color:var(--red)}
#flow-phases{display:flex;flex-direction:column;gap:6px}
.ph-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.ph-hdr{padding:10px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;transition:background .1s}
.ph-hdr:hover{background:var(--bg3)}
.ph-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.ph-title{font-weight:700;font-size:13px;color:var(--text);flex:1}
.ph-prog{font-size:11px;color:var(--text2);white-space:nowrap;min-width:40px;text-align:right}
.ph-jump{background:transparent;border:1px solid var(--border);color:var(--text2);padding:2px 9px;border-radius:4px;cursor:pointer;font-size:10px;transition:all .15s;white-space:nowrap}
.ph-jump:hover{border-color:var(--blue);color:var(--blue)}
.ph-chev{color:var(--text2);font-size:11px;transition:transform .2s;flex-shrink:0}
.ph-card.open .ph-chev{transform:rotate(180deg)}
.ph-body{display:none;padding:8px 14px 12px;border-top:1px solid var(--border)}
.ph-card.open .ph-body{display:block}
.ph-item{display:flex;align-items:flex-start;gap:8px;padding:5px 2px;cursor:pointer;border-radius:4px}
.ph-item:hover .pi-txt{color:var(--text)}
.pi-box{width:14px;min-width:14px;height:14px;border:1px solid #484f58;border-radius:3px;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent;transition:all .15s}
.ph-item.done .pi-box{background:var(--green);border-color:var(--green);color:#fff}
.ph-item.done .pi-txt{text-decoration:line-through;color:var(--text2)!important}
.pi-txt{font-size:12px;color:#8b949e;line-height:1.5}
@media(max-width:900px){#loot-areas{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){#loot-areas{grid-template-columns:1fr};#loot-infra{grid-template-columns:repeat(2,1fr)}}
.fb-wrap{display:flex;flex-wrap:wrap;gap:4px}
.fb{background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:3px 9px;border-radius:12px;cursor:pointer;font-size:11px;transition:all .15s;user-select:none;white-space:nowrap}
.fb:hover{border-color:var(--blue);color:var(--text)}
.fb.on{color:#fff}
.fb[data-v="have-nocreds"].on{background:#5a1a1a;border-color:var(--red);color:var(--red)}
.fb[data-v="have-username"].on{background:#3a2a10;border-color:var(--orange);color:var(--orange)}
.fb[data-v="have-password"].on{background:#3a3210;border-color:var(--yellow);color:var(--yellow)}
.fb[data-v="have-hash"].on{background:#2a1a50;border-color:var(--purple);color:var(--purple)}
.fb[data-v="have-localadmin"].on{background:#0d2a50;border-color:var(--blue);color:var(--blue)}
.fb[data-v="have-domainadmin"].on{background:#0a2a18;border-color:var(--green);color:var(--green)}
.fb[data-v="have-foothold"].on{background:#1a1a3a;border-color:#79c0ff;color:#79c0ff}
.fb[data-g="proto"].on{background:#0c1f3e;border-color:#1f6feb;color:#79c0ff}
.fb[data-g="cat"].on{background:#1e1040;border-color:#6e40c9;color:#c9a4ff}
#clear-btn{width:100%;margin-top:10px;padding:6px;background:transparent;border:1px solid var(--border);color:var(--text2);border-radius:6px;cursor:pointer;font-size:12px}
#clear-btn:hover{border-color:var(--red);color:var(--red)}
#main{flex:1;padding:20px;overflow-y:auto;min-width:0}
#search{width:100%;background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:6px;font-size:14px;margin-bottom:10px;outline:none;transition:border-color .15s}
#search:focus{border-color:var(--blue)}
#search::placeholder{color:var(--text2)}
#count{font-size:12px;color:var(--text2);margin-bottom:14px;display:block}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:10px;align-items:start}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;overflow:hidden;transition:border-color .15s}
.card:hover{border-color:#484f58}
.ch{padding:12px 14px 8px;cursor:pointer;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ct{font-weight:600;font-size:13px;color:var(--text);line-height:1.3}
.cv{color:var(--text2);font-size:11px;margin-top:2px;flex-shrink:0;transition:transform .2s}
.card.open .cv{transform:rotate(180deg)}
.ctags{padding:0 14px 10px;display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:10px;padding:1px 7px;border-radius:10px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.t-have-nocreds{background:#3d1010;color:#f85149;border-color:#5a2020}
.t-have-username{background:#2d1f0e;color:#ffa657;border-color:#4a3010}
.t-have-password{background:#2d260a;color:#d29922;border-color:#4a3e10}
.t-have-hash{background:#231640;color:#a371f7;border-color:#3a2060}
.t-have-localadmin{background:#0d2340;color:#58a6ff;border-color:#1a3555}
.t-have-domainadmin{background:#0d2618;color:#2ea043;border-color:#1a3f25}
.t-proto-smb,.t-proto-ldap,.t-proto-kerberos{background:#0c1f3e;color:#79c0ff;border-color:#1e3a6e}
.t-proto-winrm,.t-proto-rdp,.t-proto-ssh{background:#0d2618;color:#56d364;border-color:#1a3f25}
.t-proto-mssql{background:#231640;color:#d2a8ff;border-color:#3a2060}
.t-proto-network{background:#1c1f24;color:#8b949e;border-color:#30363d}
.t-proto-dns{background:#0c1f3e;color:#79c0ff;border-color:#1e3a6e}
.t-have-foothold{background:#1a1a3a;color:#79c0ff;border-color:#2a2a6a}
.t-cat-enum{background:#0c2040;color:#58a6ff;border-color:#1e3a6e}
.t-cat-spray{background:#2d1f0e;color:#ffa657;border-color:#4a3010}
.t-cat-dump{background:#3d1010;color:#f85149;border-color:#5a2020}
.t-cat-lateral{background:#231640;color:#a371f7;border-color:#3a2060}
.t-cat-privesc{background:#2d260a;color:#d29922;border-color:#4a3e10}
.t-cat-persist{background:#1c1f24;color:#8b949e;border-color:#30363d}
.t-cat-adcs{background:#0d2618;color:#56d364;border-color:#1a3f25}
.t-cat-bloodhound{background:#3d1a10;color:#ff7b72;border-color:#5a2820}
.t-cat-delegation{background:#0c2040;color:#79c0ff;border-color:#1e3a6e}
.t-cat-trusts{background:#2a1a40;color:#c9a4ff;border-color:#3a2a5a}
.t-cat-exploit{background:#3d1010;color:#ff7b72;border-color:#5a1a1a}
.fb[data-v="have-adcs"].on{background:#0d3020;border-color:#3fb950;color:#3fb950}
.fb[data-v="have-exchange"].on{background:#3a1a0a;border-color:var(--orange);color:var(--orange)}
.fb[data-g="cat"][data-v="cat-coerce"].on{background:#3a0a0a;border-color:#f85149;color:#ff7b72}
.fb[data-g="cat"][data-v="cat-relay"].on{background:#2a1a40;border-color:#a371f7;color:#d2a8ff}
.t-have-adcs{background:#0d2618;color:#3fb950;border-color:#1a4025}
.t-have-exchange{background:#2d1a0a;color:#ffa657;border-color:#4a2a10}
.t-cat-coerce{background:#2d0a0a;color:#ff7b72;border-color:#5a1010}
.t-cat-relay{background:#2a1a40;color:#d2a8ff;border-color:#3a2060}
.cb{display:none;padding:0 14px 14px;border-top:1px solid var(--border)}
.card.open .cb{display:block}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.mi{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:6px 8px}
.ml{font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--text2);font-weight:700;margin-bottom:2px}
.mv{font-size:12px;color:var(--text)}
.cblock{position:relative;margin:8px 0}
.cblock pre{background:#0d1117;border:1px solid var(--border);border-radius:6px;padding:10px 12px;overflow-x:auto;font-family:'Cascadia Code','Fira Code',Consolas,monospace;font-size:11.5px;line-height:1.65;color:#e6edf3;padding-right:60px}
.cpbtn{position:absolute;top:6px;right:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:2px 8px;border-radius:4px;cursor:pointer;font-size:10px}
.cpbtn:hover{border-color:var(--blue);color:var(--blue)}
.cpbtn.ok{color:var(--green);border-color:var(--green)}
.note{background:#1c1f0e;border:1px solid #3a3a1a;border-left:3px solid var(--yellow);border-radius:4px;padding:6px 10px;font-size:12px;color:#d29922;margin:8px 0}
.warn{background:#1c100e;border:1px solid #3a2018;border-left:3px solid var(--red);border-radius:4px;padding:6px 10px;font-size:12px;color:#f85149;margin:8px 0}
.reflink{display:inline-block;color:var(--blue);font-size:11px;text-decoration:none;margin-top:6px}
.reflink:hover{text-decoration:underline}
.nores{text-align:center;color:var(--text2);padding:60px 20px;font-size:14px;grid-column:1/-1}
@media(max-width:700px){body{flex-direction:column}#sidebar{width:100%;height:auto;position:relative;border-right:none;border-bottom:1px solid var(--border)}#cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="sidebar">
  <h1>AD Pentest Ref</h1>
  <div class="fg">
    <div class="fg-label">I Have <span class="fg-hint" title="Shows only techniques your current access level can perform. Higher selections imply lower ones (Domain Admin implies Local Admin implies Foothold etc). ADCS/Exchange must be selected separately.">&#x2139;</span></div>
    <div class="fb-wrap">
      <button class="fb" data-g="have" data-v="have-nocreds">No Creds</button>
      <button class="fb" data-g="have" data-v="have-foothold">Foothold (shell)</button>
      <button class="fb" data-g="have" data-v="have-username">Username</button>
      <button class="fb" data-g="have" data-v="have-password">Password</button>
      <button class="fb" data-g="have" data-v="have-hash">NTLM Hash</button>
      <button class="fb" data-g="have" data-v="have-localadmin">Local Admin</button>
      <button class="fb" data-g="have" data-v="have-domainadmin">Domain Admin</button>
      <button class="fb" data-g="have" data-v="have-adcs">ADCS Present</button>
      <button class="fb" data-g="have" data-v="have-exchange">Exchange Present</button>
    </div>
  </div>
  <div class="fg">
    <div class="fg-label">Protocol / Service</div>
    <div class="fb-wrap">
      <button class="fb" data-g="proto" data-v="proto-smb">SMB :445</button>
      <button class="fb" data-g="proto" data-v="proto-ldap">LDAP :389</button>
      <button class="fb" data-g="proto" data-v="proto-kerberos">Kerberos :88</button>
      <button class="fb" data-g="proto" data-v="proto-winrm">WinRM :5985</button>
      <button class="fb" data-g="proto" data-v="proto-rdp">RDP :3389</button>
      <button class="fb" data-g="proto" data-v="proto-mssql">MSSQL :1433</button>
      <button class="fb" data-g="proto" data-v="proto-ssh">SSH :22</button>
      <button class="fb" data-g="proto" data-v="proto-network">Network</button>
      <button class="fb" data-g="proto" data-v="proto-dns">DNS :53</button>
    </div>
  </div>
  <div class="fg">
    <div class="fg-label">Category</div>
    <div class="fb-wrap">
      <button class="fb" data-g="cat" data-v="cat-enum">Enumeration</button>
      <button class="fb" data-g="cat" data-v="cat-spray">Spray</button>
      <button class="fb" data-g="cat" data-v="cat-dump">Cred Dump</button>
      <button class="fb" data-g="cat" data-v="cat-lateral">Lateral Move</button>
      <button class="fb" data-g="cat" data-v="cat-privesc">Priv Esc</button>
      <button class="fb" data-g="cat" data-v="cat-persist">Persistence</button>
      <button class="fb" data-g="cat" data-v="cat-adcs">ADCS</button>
      <button class="fb" data-g="cat" data-v="cat-bloodhound">BloodHound</button>
      <button class="fb" data-g="cat" data-v="cat-delegation">Delegation</button>
      <button class="fb" data-g="cat" data-v="cat-trusts">Trust Attack</button>
      <button class="fb" data-g="cat" data-v="cat-exploit">CVE/Exploit</button>
      <button class="fb" data-g="cat" data-v="cat-coerce">Coercion</button>
      <button class="fb" data-g="cat" data-v="cat-relay">NTLM Relay</button>
    </div>
  </div>
  <button id="clear-btn">Clear All Filters</button>
</div>

<div id="main">
  <div id="view-tabs">
    <button class="vtab active" data-view="cards">&#128269; Techniques</button>
    <button class="vtab" data-view="flow">&#128203; Flow &amp; Tracker</button>
  </div>

  <!-- Techniques view -->
  <div id="cards-section">
    <input type="search" id="search" placeholder="Search techniques, commands, tools, protocols..." autocomplete="off">
    <span id="count"></span>
    <div id="cards"></div>
  </div>

  <!-- Flow & Tracker view -->
  <div id="flow-view">
    <div id="loot-tracker">
      <div id="loot-hdr">
        <span id="loot-hdr-title">&#127918; Loot Tracker</span>
        <div id="loot-hdr-btns">
          <button class="loot-btn" id="loot-copy-btn">&#128203; Copy Summary</button>
          <button class="loot-btn" id="loot-clear-btn">Clear All</button>
        </div>
      </div>
      <div id="loot-infra">
        <div class="li-field"><label>DC IP</label><input id="l-dcip" placeholder="10.10.x.x" autocomplete="off"></div>
        <div class="li-field"><label>Domain FQDN</label><input id="l-domain" placeholder="corp.local" autocomplete="off"></div>
        <div class="li-field"><label>DC Hostname</label><input id="l-dchost" placeholder="DC01" autocomplete="off"></div>
        <div class="li-field"><label>CA / ADCS Server</label><input id="l-ca" placeholder="CA IP or hostname" autocomplete="off"></div>
        <div class="li-field"><label>Exchange Server</label><input id="l-exch" placeholder="Exchange IP" autocomplete="off"></div>
        <div class="li-field"><label>Other (MSSQL, WSUS…)</label><input id="l-other" placeholder="host:port" autocomplete="off"></div>
      </div>
      <div id="l-access-wrap">
        <label>Current Access Level</label>
        <div id="l-access-btns">
          <button class="alevbtn" data-v="nocreds">No Creds</button>
          <button class="alevbtn" data-v="username">Username</button>
          <button class="alevbtn" data-v="password">Password</button>
          <button class="alevbtn" data-v="foothold">Foothold (shell)</button>
          <button class="alevbtn" data-v="localadmin">Local Admin</button>
          <button class="alevbtn" data-v="domainadmin">Domain Admin &#127881;</button>
        </div>
      </div>
      <div id="loot-areas">
        <div class="la-field"><label>Users Found</label><textarea id="l-users" placeholder="user1&#10;user2&#10;svc_account"></textarea></div>
        <div class="la-field"><label>Credentials</label><textarea id="l-creds" placeholder="user:password&#10;jdoe:Summer2024!"></textarea></div>
        <div class="la-field"><label>NT Hashes</label><textarea id="l-hashes" placeholder="user:NTLMhash&#10;admin:aad3b435..."></textarea></div>
        <div class="la-field"><label>Notes / BloodHound Paths</label><textarea id="l-notes" placeholder="Kerberoast targets&#10;BloodHound edges&#10;Tickets / TGTs captured"></textarea></div>
      </div>
    </div>
    <div id="flow-ph-hdr">
      <span>Attack Flow Checklist</span>
      <button id="flow-reset-btn">Reset All Checks</button>
    </div>
    <div id="flow-phases"></div>
  </div>
</div>

<script>
const D = [
  {
    title: 'Initial Windows Host Recon',
    req: 'Foothold on a Windows machine',
    gets: 'Domain name, DC IP, current user context, privileges',
    tags: ['have-nocreds','cat-enum'],
    cmd: `ipconfig /all              # Domain name, DNS = DC IP
whoami                     # Current user
whoami /groups             # Look for Domain Admins, Backup Operators, etc.
whoami /priv               # SeDebugPrivilege, SeBackupPrivilege, SeImpersonatePrivilege
net user                   # Local users
net user /domain           # Domain users
net group /domain          # Domain groups
net group "Domain Admins" /domain
net group "Enterprise Admins" /domain
net localgroup Administrators
systeminfo                 # OS, hotfixes, domain name
hostname
set                        # Env vars — can leak domain, username, paths
netstat -ano               # Active connections + listening ports
tasklist /svc              # Running services
net share                  # Shared folders on this host

# Find the DC
nslookup -type=SRV _ldap._tcp.dc._msdcs.<domain>
nltest /dclist:<domain>`,
    note: 'DNS server in ipconfig = DC IP. SeImpersonatePrivilege on service account = Potato attack to SYSTEM.'
  },
  {
    title: 'nmap — AD Port Scan',
    req: 'Network access to target',
    gets: 'Open ports, service versions, DC confirmation, vuln check',
    tags: ['have-nocreds','proto-network','proto-smb','proto-ldap','cat-enum'],
    cmd: `# Fast full port scan
nmap -p- --min-rate 5000 -T4 <IP> -oN ports.txt

# Service + version + scripts on key AD ports

function buildCard(t, idx){
  const tags = t.tags.map(tag =>
    `<span class="tag t-${tag}">${TAG_LABEL[tag]||tag}</span>`
  ).join('');
  const metaReq = t.req ? `<div class="mi"><div class="ml">Requires</div><div class="mv">${esc(t.req)}</div></div>` : '';
  const metaGets = t.gets ? `<div class="mi"><div class="ml">Gets You</div><div class="mv">${esc(t.gets)}</div></div>` : '';
  const meta = (metaReq||metaGets) ? `<div class="meta">${metaReq}${metaGets}</div>` : '';
  const note = t.note ? `<div class="note">${esc(t.note)}</div>` : '';
  const warn = t.warn ? `<div class="warn">${esc(t.warn)}</div>` : '';
  const ref = t.ref ? `<a class="reflink" href="${t.ref}" target="_blank" rel="noopener">Reference &rarr;</a>` : '';
  const cmdBlock = `<div class="cblock"><pre>${esc(t.cmd)}</pre><button class="cpbtn" data-idx="${idx}">Copy</button></div>`;
  const searchText = [t.title,t.req||'',t.gets||'',t.cmd,t.note||'',t.warn||''].join(' ').toLowerCase();
  return `<div class="card" data-tags="${t.tags.join(' ')}" data-text="${searchText.replace(/"/g,'&quot;')}">
  <div class="ch" onclick="toggle(this)">
    <span class="ct">${esc(t.title)}</span>
    <span class="cv">&#9660;</span>
  </div>
  <div class="ctags">${tags}</div>
  <div class="cb">${meta}${note}${warn}${cmdBlock}${ref}</div>
</div>`;
}

// ── Filter logic ─────────────────────────────────────────────────────────────
// "I Have" group uses a privilege hierarchy:
//   selecting 'have-password' implicitly covers 'have-username' and 'have-nocreds'.
//   Cards whose have-* requirements exceed what you selected are hidden.
//   Environmental tags (have-adcs, have-exchange) are NOT in the chain —
//   a card tagged with them only shows when that env tag is explicitly selected.
const PRIV_TAGS = new Set([
  'have-nocreds','have-username','have-password',
  'have-hash','have-foothold','have-localadmin','have-domainadmin'
]);
const HAVE_IMPLIES = {
  'have-nocreds':    [],
  'have-username':   ['have-nocreds'],
  'have-password':   ['have-username','have-nocreds'],
  'have-hash':       ['have-password','have-username','have-nocreds'],
  'have-foothold':   ['have-password','have-username','have-nocreds'],
  'have-localadmin': ['have-foothold','have-hash','have-password','have-username','have-nocreds'],
  'have-domainadmin':['have-localadmin','have-foothold','have-hash','have-password','have-username','have-nocreds']
};

function applyFilters(){
  const groups = {};
  document.querySelectorAll('.fb.on').forEach(btn=>{
    const g = btn.dataset.g, v = btn.dataset.v;
    if(!groups[g]) groups[g]=new Set();
    groups[g].add(v);
  });

  const selHave = groups['have'] || new Set();

  // Build effective privilege set: selected priv tags + everything they imply
  const effPriv = new Set();
  selHave.forEach(tag=>{
    if(PRIV_TAGS.has(tag)){
      effPriv.add(tag);
      (HAVE_IMPLIES[tag]||[]).forEach(t=>effPriv.add(t));
    }
  });

  const q = document.getElementById('search').value.toLowerCase().trim();
  let vis=0;
  document.querySelectorAll('.card').forEach(card=>{
    const cardTags = card.dataset.tags.split(' ');
    const tagSet   = new Set(cardTags);

    let haveMatch = true;
    if(selHave.size > 0){
      const cardPrivTags = cardTags.filter(t=>PRIV_TAGS.has(t));
      const cardEnvTags  = cardTags.filter(t=>t.startsWith('have-') && !PRIV_TAGS.has(t));

      // Privilege gate: every priv-tag the card needs must be covered by effective set
      const privOk = effPriv.size===0 || cardPrivTags.every(t=>effPriv.has(t));

      // Environment gate: every env-tag the card needs must be explicitly selected
      const envOk  = cardEnvTags.every(t=>selHave.has(t));

      haveMatch = privOk && envOk;
    }

    // proto + cat groups: OR within group, AND between groups (unchanged)
    const otherMatch = Object.entries(groups)
      .filter(([g])=>g!=='have')
      .every(([,vals])=>[...vals].some(v=>tagSet.has(v)));

    const matchSearch = !q || card.dataset.text.includes(q);
    const show = haveMatch && otherMatch && matchSearch;
    card.style.display = show ? '' : 'none';
    if(show) vis++;
  });
  const c = document.getElementById('count');
  c.textContent = `${vis} of ${D.length} techniques`;
  if(vis===0){
    if(!document.querySelector('.nores')){
      const d=document.createElement('div');
      d.className='nores';d.textContent='No techniques match. Try clearing some filters.';
      container.appendChild(d);
    }
  } else {
    const nr=document.querySelector('.nores');
    if(nr) nr.remove();
  }
}

// ── Render flow phases ────────────────────────────────────────────────────────
function renderFlow(){
  const fp = document.getElementById('flow-phases');
  fp.innerHTML = FLOW.map(phase=>{
    const itemsHtml = phase.items.map((item,i)=>`
      <div class="ph-item" data-phase="${phase.id}" data-idx="${i}" onclick="toggleCheck(this)">
        <div class="pi-box">&#10003;</div>
        <span class="pi-txt">${item}</span>
      </div>`).join('');
    const jh = phase.jump.have.map(v=>`'${v}'`).join(',');
    const jc = phase.jump.cat.map(v=>`'${v}'`).join(',');
    return `<div class="ph-card" id="phcard-${phase.id}">
      <div class="ph-hdr" onclick="togglePhase('${phase.id}')">
        <div class="ph-dot" style="background:${phase.color}"></div>
        <span class="ph-title">${phase.label}</span>
        <span class="ph-prog" id="prog-${phase.id}">0 / ${phase.items.length}</span>
        <button class="ph-jump" onclick="event.stopPropagation();jumpFilter([${jh}],[${jc}])">Filter &rarr;</button>
        <span class="ph-chev">&#9660;</span>
      </div>
      <div class="ph-body">${itemsHtml}</div>
    </div>`;
  }).join('');
  loadChecks();
}

function togglePhase(id){
  document.getElementById('phcard-'+id).classList.toggle('open');
}

function toggleCheck(el){
  el.classList.toggle('done');
  const key = 'ck_'+el.dataset.phase+'_'+el.dataset.idx;
  el.classList.contains('done') ? localStorage.setItem(key,'1') : localStorage.removeItem(key);
  updateProgress(el.dataset.phase);
}

function updateProgress(phaseId){
  const phase = FLOW.find(p=>p.id===phaseId);
  if(!phase) return;
  const done = phase.items.filter((_,i)=>localStorage.getItem('ck_'+phaseId+'_'+i)==='1').length;
  const el = document.getElementById('prog-'+phaseId);
  if(!el) return;
  el.textContent = done+' / '+phase.items.length;
  el.style.color = done===phase.items.length ? 'var(--green)' : 'var(--text2)';
}

function loadChecks(){
  FLOW.forEach(phase=>{
    phase.items.forEach((_,i)=>{
      if(localStorage.getItem('ck_'+phase.id+'_'+i)==='1'){
        const el = document.querySelector(`.ph-item[data-phase="${phase.id}"][data-idx="${i}"]`);
        if(el) el.classList.add('done');
      }
    });
    updateProgress(phase.id);
  });
}

function jumpFilter(haveTags, catTags){
  document.querySelectorAll('.vtab').forEach(b=>b.classList.remove('active'));
  document.querySelector('.vtab[data-view="cards"]').classList.add('active');
  document.getElementById('cards-section').style.display = '';
  document.getElementById('flow-view').style.display = 'none';
  document.querySelectorAll('.fb.on').forEach(b=>b.classList.remove('on'));
  [...haveTags,...catTags].forEach(v=>{
    const btn = document.querySelector(`.fb[data-v="${v}"]`);
    if(btn) btn.classList.add('on');
  });
  applyFilters();
  window.scrollTo(0,0);
}

document.getElementById('flow-reset-btn').addEventListener('click',()=>{
  if(!confirm('Reset all phase checkboxes?')) return;
  FLOW.forEach(phase=>{
    phase.items.forEach((_,i)=>localStorage.removeItem('ck_'+phase.id+'_'+i));
  });
  document.querySelectorAll('.ph-item.done').forEach(el=>el.classList.remove('done'));
  FLOW.forEach(p=>updateProgress(p.id));
});
